<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>CareerNest</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand">
        <img src="icons/careernest-dark-logo.svg" alt="CareerNest" />
        <p>Automatic application history</p>
      </header>

      <section class="tracker">
        <strong>Tracking is on</strong>
        <p id="tab-status">Apply on a job page and CareerNest will watch for a submitted confirmation.</p>
        <dl class="details" id="page-details" hidden>
          <div>
            <dt>Title</dt>
            <dd id="detail-title"></dd>
          </div>
          <div>
            <dt>Company</dt>
            <dd id="detail-company"></dd>
          </div>
          <div>
            <dt>Confirmation</dt>
            <dd id="detail-confirmation"></dd>
          </div>
        </dl>
        <button id="check-page" type="button">Check this page now</button>
      </section>

      <section class="settings">
        <label for="api-url">API URL</label>
        <input id="api-url" type="url" spellcheck="false" />
        <button id="save-api-url" type="button">Save API URL</button>
        <p id="api-status" aria-live="polite"></p>
      </section>

      <p class="hint">
        Use your hosted API URL here. Local development still works with http://localhost:8000.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
